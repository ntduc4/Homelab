name: devs

networks:
  proxy:
    external: true

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    restart: unless-stopped

    environment:
      - USER_UID=1000
      - USER_GID=1000

      # Main URL (CHANGE HERE IF DON'T WANT TO EXPOSE)
      - FORGEJO__server__DOMAIN=git.${EXTERNAL_DOMAIN}
      - FORGEJO__server__ROOT_URL=https://git.${EXTERNAL_DOMAIN}/

      # SSH clone/push URL shown by Forgejo (Hide in tailnet)
      - FORGEJO__server__SSH_DOMAIN=git.${TAILSCALE_DOMAIN}
      - FORGEJO__server__SSH_PORT=2107

      # SQLite, lightweight default
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__database__SQLITE_JOURNAL_MODE=WAL

      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=false
      - FORGEJO__service__SHOW_REGISTRATION_BUTTON=false
      - FORGEJO__service__DEFAULT_USER_VISIBILITY=public
      - FORGEJO__service__DEFAULT_ORG_VISIBILITY=public

    volumes:
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ${LFS_DATA_PATH}:/lfs

    ports:
      - "2107:22"

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.forgejo.rule=Host(`git.${TAILSCALE_DOMAIN}`) || Host(`git.${EXTERNAL_DOMAIN}`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.tls=true"

      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"

  bambuddy:
    image: ghcr.io/maziggy/bambuddy:${BAMBUDDY_VERSION:-latest}
    container_name: bambuddy
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${BAMBUDDY_WEB_PORT:-8000}:8000"
      - "3000:3000"
      - "3002:3002"
      - "2021:2021/udp"
      - "8883:8883"
      - "990:990"
      - "6000:6000"
      - "322:322"
      - "2024-2026:2024-2026"
      - "${BAMBUDDY_FTP_PASSIVE_RANGE:-50000-50100}:${BAMBUDDY_FTP_PASSIVE_RANGE:-50000-50100}"
    environment:
      - TZ=${TZ:-Asia/Singapore}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PORT=8000
      - VIRTUAL_PRINTER_PASV_ADDRESS=${VIRTUAL_PRINTER_PASV_ADDRESS}
      - SLICER_API_URL=http://orca-slicer-api:3003
      - BAMBUDDY_EXTERNAL_ROOTS=${BAMBUDDY_EXTERNAL_ROOTS:-}
    volumes:
      - ./bambuddy/data:/app/data
      - ./bambuddy/logs:/app/logs
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.bambuddy.rule=Host(`bambuddy.${TAILSCALE_DOMAIN}`) || Host(`bambuddy.${EXTERNAL_DOMAIN}`)"
      - "traefik.http.routers.bambuddy.entrypoints=websecure"
      - "traefik.http.routers.bambuddy.tls=true"
      - "traefik.http.routers.bambuddy.service=bambuddy"
      - "traefik.http.services.bambuddy.loadbalancer.server.port=8000"
    stop_grace_period: 30s

  orca-slicer-api:
    image: ghcr.io/maziggy/orca-slicer-api:${SIDECAR_TAG:-latest}
    container_name: orca-slicer-api
    restart: unless-stopped
    environment:
      - PORT=3003
      - MAX_MODEL_UPLOAD_MB=${MAX_MODEL_UPLOAD_MB:-512}
    ports:
      - "${ORCA_API_PORT:-3003}:3003"
    networks:
      - proxy
